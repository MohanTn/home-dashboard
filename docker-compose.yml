services:
  dashboard:
    build: .
    image: home-dashboard
    container_name: home-dashboard
    restart: unless-stopped
    ports:
      # Host 5000. Change the left side if something else already owns it.
      - "5000:5000"
    environment:
      # Change this before the first start.
      DASHBOARD_PASSWORD: "changeme"
      # Set true only when served over HTTPS by a reverse proxy.
      SECURE_COOKIE: "false"
      SESSION_HOURS: "720"
    volumes:
      # apps.json lives here once the container starts, so cards you add persist.
      - dashboard-data:/data
    networks:
      - homelab

volumes:
  dashboard-data:

# Attach your other app containers to this same network and their container
# names resolve as hostnames, e.g. http://jellyfin:8096 in a card URL.
networks:
  homelab:
    name: homelab
