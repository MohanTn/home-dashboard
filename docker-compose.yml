services:
  dashboard:
    build: .
    image: home-dashboard
    container_name: home-dashboard
    restart: unless-stopped
    ports:
      # Host 80. Change the left side if a reverse proxy already owns it.
      - "80:80"
    # The container runs as the non-root `node` user, which cannot bind port 80
    # by default. This lifts that limit inside the container only.
    sysctls:
      - net.ipv4.ip_unprivileged_port_start=0
    environment:
      # Change this before the first start.
      DASHBOARD_PASSWORD: "changeme"
      # Set true only when served over HTTPS by a reverse proxy.
      SECURE_COOKIE: "false"
      SESSION_HOURS: "720"
    volumes:
      # apps.json lives here once the container starts, so cards you add persist.
      - dashboard-data:/data
    networks:
      - homelab

volumes:
  dashboard-data:

# Attach your other app containers to this same network and their container
# names resolve as hostnames, e.g. http://jellyfin:8096 in a card URL.
networks:
  homelab:
    name: homelab
